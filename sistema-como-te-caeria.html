<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>¿Cómo te caería? — Sistema</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #17110D; }
  body { font-family: 'Work Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; color: #F5EFE6; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #3A2D22; border-radius: 4px; }
  textarea, input, button { font-family: inherit; }
  textarea::placeholder, input::placeholder { color: #B9A88F; opacity: 0.7; }
  button { cursor: pointer; }

  .brand-title { font-family: 'Anton', sans-serif; color: #F2B705; letter-spacing: .02em; font-size: 1.6rem; line-height: 1; }
  header { padding: 20px 16px 16px; position: sticky; top: 0; z-index: 20; background: #17110D; border-bottom: 1px solid #3A2D22; }
  .subtitle { font-size: 12px; margin-top: 4px; color: #B9A88F; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; }
  .tabs.sections { position: sticky; top: 74px; z-index: 10; background: #17110D; border-bottom: 1px solid #3A2D22; }
  .tab-btn { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; background: #221A14; color: #F5EFE6; border: 1px solid #3A2D22; }
  .tab-btn.active { background: #E8472B; color: #1A1410; border-color: #E8472B; }
  .sub-btn { border-radius: 999px; padding: 6px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0; background: transparent; color: #B9A88F; border: 1px solid #3A2D22; font-weight: 500; }
  .sub-btn.active { background: #F2B705; color: #1A1410; border-color: #F2B705; font-weight: 700; }

  main { padding: 4px 16px 64px; }
  .panel-label { color: #B9A88F; letter-spacing: .08em; font-size: 11px; text-transform: uppercase; }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

  textarea.note-input { width: 100%; border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.6; outline: none; resize: vertical; background: #221A14; color: #F5EFE6; border: 1px solid #3A2D22; }

  .add-btn { border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; background: #E8472B; color: #1A1410; border: none; }
  .empty { border-radius: 12px; padding: 24px; text-align: center; font-size: 14px; background: #221A14; border: 1px dashed #3A2D22; color: #B9A88F; }

  .entry-card { border-radius: 12px; padding: 12px; background: #221A14; border: 1px solid #3A2D22; margin-bottom: 12px; }
  .entry-top { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .del-btn { background: none; border: none; color: #B9A88F; font-size: 14px; }
  .field-label { font-size: 10px; text-transform: uppercase; margin-bottom: 4px; color: #B9A88F; letter-spacing: .06em; }
  .field-input, .field-textarea { width: 100%; border-radius: 8px; padding: 6px 8px; font-size: 14px; outline: none; background: #2C2119; color: #F5EFE6; border: 1px solid #3A2D22; }
  .field-textarea { resize: vertical; }
  .field-wrap { margin-bottom: 8px; }

  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #F2B705; color: #1A1410; font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 50; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Config: 9 áreas x subsecciones, sin librerías externas — todo JS puro.
// ---------------------------------------------------------------------------
function uid() { return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2); }

var SECTIONS = [
  { key: 'marca', label: 'Marca', emoji: '🧠', subs: [
    { key: 'adn', label: 'ADN', type: 'note',
      seed: '¿Cómo te caería? es una marca de comida y experiencias en Culiacán y Sinaloa. No es una cuenta de reseñas gastronómicas: es sobre descubrir y vivir experiencias que generen curiosidad, antojo y entretenimiento. La frase "¿Cómo te caería?" es el sello y el punto de entrada a cada contenido — comida, restaurantes, hoteles, bares, actividades o cualquier experiencia con potencial de interés. El objetivo es construir comunidad, no solo acumular seguidores.' },
    { key: 'voz', label: 'Voz', type: 'note',
      seed: 'Se habla como en una plática real entre amigos, nunca como crítico gastronómico ni influencer genérico. Frases cortas y naturales: "hoy amanecimos con antojo de sushi", "nos jalamos a...", "está enorme", "vamos a ver qué tal". Se evitan frases genéricas ("explosión de sabores", "experiencia culinaria única", "nos sorprendió gratamente"). El lenguaje siempre conserva la personalidad real del creador.' },
    { key: 'personalidad', label: 'Personalidad', type: 'note',
      seed: 'Natural, cercana, divertida, espontánea y segura. Identidad local sinaloense, sin exagerarla ni convertirla en personaje. Resumen: "desmadre para personas fresas" — relajado y con personalidad, sin vulgaridad ni exceso de barrio. El humor sale de situaciones, reacciones y decisiones reales, nunca de insultos.' },
    { key: 'audiencia', label: 'Audiencia', type: 'note',
      seed: 'Personas interesadas en comida, restaurantes, lugares y experiencias, con Culiacán y Sinaloa como mercado inicial. La comunidad ideal comenta, comparte, guarda, recomienda lugares, participa en votaciones y espera contenido nuevo — no es audiencia pasiva.' },
  ]},
  { key: 'contenido', label: 'Contenido', emoji: '🎥', subs: [
    { key: 'estrategia', label: 'Estrategia', type: 'note',
      seed: 'Principios: experiencia sobre publicidad, personalidad sobre estética, naturalidad sobre perfección, entretenimiento sobre reseña, formatos propios sobre contenido repetitivo, comunidad sobre audiencia pasiva. La cuenta no depende solo de colaboraciones — necesita ideas propias que se puedan grabar sin que un negocio invite o pague.' },
    { key: 'formatos', label: 'Formatos', type: 'list',
      fields: [{ id: 'nombre', label: 'Formato' }, { id: 'notas', label: 'Descripción', long: true }],
      seed: [{ id: uid(), nombre: 'Subasta de comida', notas: 'Participantes reciben presupuesto y deciden cuánto ofrecer por distintos platillos. El interés está en las decisiones y la estrategia, no solo en la comida.' }] },
    { key: 'ideas', label: 'Ideas', type: 'list',
      fields: [{ id: 'titulo', label: 'Idea' }, { id: 'pilar', label: 'Pilar' }, { id: 'estado', label: 'Estado' }],
      seed: [
        { id: uid(), titulo: 'Comparar el mismo platillo en 3 lugares, la comunidad vota', pilar: 'Comida', estado: 'Idea' },
        { id: uid(), titulo: 'El más grande vs. el más caro (mismo tipo de comida)', pilar: 'Comida', estado: 'Idea' },
        { id: uid(), titulo: 'Ir a un lugar que nadie recomienda y ver si la fama es justa', pilar: 'Restaurantes', estado: 'Idea' },
        { id: uid(), titulo: 'Reto: adivinar el precio antes de que te digan', pilar: 'Formatos propios', estado: 'Idea' },
        { id: uid(), titulo: 'Video generado 100% por petición de un comentario', pilar: 'Comunidad', estado: 'Idea' },
      ] },
    { key: 'hooks', label: 'Hooks', type: 'list',
      fields: [{ id: 'texto', label: 'Gancho', long: true }, { id: 'pilar', label: 'Pilar' }],
      seed: [
        { id: uid(), texto: 'Hoy amanecimos con antojo de [platillo] y esto es lo que encontramos', pilar: 'Comida' },
        { id: uid(), texto: 'Nos jalamos a un lugar que casi nadie conoce todavía y...', pilar: 'Restaurantes' },
        { id: uid(), texto: 'Le dimos [presupuesto] a cada quien y esto fue lo que pasó', pilar: 'Formatos propios' },
        { id: uid(), texto: 'Nos pidieron que fuéramos aquí como 20 veces en los comentarios', pilar: 'Comunidad' },
        { id: uid(), texto: 'Nos invitaron a conocer este lugar y fuimos con la promesa de contar la verdad', pilar: 'Colaboraciones' },
      ] },
    { key: 'ctas', label: 'CTAs', type: 'list',
      fields: [{ id: 'texto', label: 'CTA' }, { id: 'tipo', label: 'Tipo' }],
      seed: [
        { id: uid(), texto: '¿Tú le entrarías o no?', tipo: 'Pregunta / decisión' },
        { id: uid(), texto: 'Etiqueta a quien se lo tienes que enseñar', tipo: 'Compartir' },
        { id: uid(), texto: 'Comenta a dónde deberíamos ir siguiente', tipo: 'Petición' },
      ] },
    { key: 'produccion', label: 'Producción', type: 'list',
      fields: [{ id: 'tarea', label: 'Tarea' }, { id: 'fecha', label: 'Fecha' }, { id: 'estado', label: 'Estado' }], seed: [] },
    { key: 'publicados', label: 'Publicados', type: 'list',
      fields: [{ id: 'titulo', label: 'Título' }, { id: 'fecha', label: 'Fecha' }, { id: 'resultado', label: 'Resultado / notas', long: true }], seed: [] },
  ]},
  { key: 'inteligencia', label: 'Inteligencia', emoji: '📊', subs: [
    { key: 'analytics', label: 'Analytics', type: 'list',
      fields: [{ id: 'fecha', label: 'Fecha' }, { id: 'metrica', label: 'Métrica' }, { id: 'valor', label: 'Valor' }, { id: 'nota', label: 'Nota', long: true }], seed: [] },
    { key: 'aprendizajes', label: 'Aprendizajes', type: 'list',
      fields: [{ id: 'aprendizaje', label: 'Aprendizaje', long: true }, { id: 'fecha', label: 'Fecha' }], seed: [] },
    { key: 'tendencias', label: 'Tendencias', type: 'list',
      fields: [{ id: 'tendencia', label: 'Tendencia' }, { id: 'fuente', label: 'Fuente' }, { id: 'nota', label: 'Nota', long: true }], seed: [] },
    { key: 'investigacion', label: 'Investigación', type: 'list',
      fields: [{ id: 'tema', label: 'Tema' }, { id: 'hallazgo', label: 'Hallazgo', long: true }, { id: 'fuente', label: 'Fuente' }], seed: [] },
  ]},
  { key: 'experiencias', label: 'Experiencias', emoji: '🍽️', subs: [
    { key: 'restaurantes', label: 'Restaurantes', type: 'list',
      fields: [{ id: 'nombre', label: 'Nombre' }, { id: 'ubicacion', label: 'Ubicación' }, { id: 'estado', label: 'Estado' }, { id: 'notas', label: 'Notas', long: true }], seed: [] },
    { key: 'hoteles', label: 'Hoteles', type: 'list',
      fields: [{ id: 'nombre', label: 'Nombre' }, { id: 'ubicacion', label: 'Ubicación' }, { id: 'estado', label: 'Estado' }, { id: 'notas', label: 'Notas', long: true }], seed: [] },
    { key: 'actividades', label: 'Actividades', type: 'list',
      fields: [{ id: 'nombre', label: 'Nombre' }, { id: 'ubicacion', label: 'Ubicación' }, { id: 'estado', label: 'Estado' }, { id: 'notas', label: 'Notas', long: true }], seed: [] },
    { key: 'lugares', label: 'Lugares', type: 'list',
      fields: [{ id: 'nombre', label: 'Nombre' }, { id: 'tipo', label: 'Tipo' }, { id: 'estado', label: 'Estado' }, { id: 'notas', label: 'Notas', long: true }], seed: [] },
  ]},
  { key: 'relaciones', label: 'Relaciones', emoji: '🤝', subs: [
    { key: 'colaboraciones', label: 'Colaboraciones', type: 'list',
      fields: [{ id: 'negocio', label: 'Negocio' }, { id: 'contacto', label: 'Contacto' }, { id: 'estado', label: 'Estado' }, { id: 'notas', label: 'Notas', long: true }], seed: [] },
    { key: 'contactos', label: 'Contactos', type: 'list',
      fields: [{ id: 'nombre', label: 'Nombre' }, { id: 'negocio', label: 'Negocio' }, { id: 'via', label: 'Teléfono / redes' }, { id: 'notas', label: 'Notas', long: true }], seed: [] },
    { key: 'seguimientos', label: 'Seguimientos', type: 'list',
      fields: [{ id: 'quien', label: 'Contacto / negocio' }, { id: 'accion', label: 'Próxima acción' }, { id: 'fecha', label: 'Fecha' }, { id: 'notas', label: 'Notas', long: true }], seed: [] },
  ]},
  { key: 'comunidad', label: 'Comunidad', emoji: '👥', subs: [
    { key: 'comentarios', label: 'Comentarios', type: 'list',
      fields: [{ id: 'comentario', label: 'Comentario', long: true }, { id: 'usuario', label: 'Usuario' }, { id: 'accion', label: 'Acción a tomar' }], seed: [] },
    { key: 'recomendaciones', label: 'Recomendaciones', type: 'list',
      fields: [{ id: 'sugerencia', label: 'Sugerencia' }, { id: 'quien', label: 'Quién la mandó' }, { id: 'estado', label: 'Estado' }], seed: [] },
    { key: 'peticiones', label: 'Peticiones', type: 'list',
      fields: [{ id: 'peticion', label: 'Petición' }, { id: 'quien', label: 'Quién la pidió' }, { id: 'estado', label: 'Estado' }], seed: [] },
  ]},
  { key: 'operacion', label: 'Operación', emoji: '📅', subs: [
    { key: 'calendario', label: 'Calendario', type: 'list',
      fields: [{ id: 'fecha', label: 'Fecha' }, { id: 'contenido', label: 'Contenido planeado' }, { id: 'estado', label: 'Estado' }], seed: [] },
    { key: 'produccion', label: 'Producción', type: 'list',
      fields: [{ id: 'tarea', label: 'Tarea' }, { id: 'responsable', label: 'Responsable' }, { id: 'fecha', label: 'Fecha límite' }, { id: 'estado', label: 'Estado' }], seed: [] },
    { key: 'publicaciones', label: 'Publicaciones', type: 'list',
      fields: [{ id: 'fecha', label: 'Fecha' }, { id: 'titulo', label: 'Título' }, { id: 'plataforma', label: 'Plataforma' }, { id: 'link', label: 'Link' }], seed: [] },
  ]},
  { key: 'visual', label: 'Marca Visual', emoji: '🎨', subs: [
    { key: 'logo', label: 'Logo', type: 'note', seed: '' },
    { key: 'portadas', label: 'Portadas', type: 'list',
      fields: [{ id: 'nombre', label: 'Nombre' }, { id: 'link', label: 'Link' }, { id: 'descripcion', label: 'Descripción', long: true }], seed: [] },
    { key: 'plantillas', label: 'Plantillas', type: 'list',
      fields: [{ id: 'nombre', label: 'Nombre' }, { id: 'uso', label: 'Uso' }, { id: 'link', label: 'Link' }], seed: [] },
    { key: 'mediakit', label: 'Media Kit', type: 'note', seed: '' },
  ]},
  { key: 'negocio', label: 'Negocio', emoji: '💰', subs: [
    { key: 'colaboraciones', label: 'Colaboraciones', type: 'list',
      fields: [{ id: 'negocio', label: 'Negocio' }, { id: 'tipo', label: 'Tipo' }, { id: 'valor', label: 'Valor' }, { id: 'estado', label: 'Estado' }], seed: [] },
    { key: 'paquetes', label: 'Paquetes', type: 'list',
      fields: [{ id: 'nombre', label: 'Paquete' }, { id: 'incluye', label: 'Incluye', long: true }, { id: 'precio', label: 'Precio' }], seed: [] },
    { key: 'ingresos', label: 'Ingresos', type: 'list',
      fields: [{ id: 'fecha', label: 'Fecha' }, { id: 'concepto', label: 'Concepto' }, { id: 'monto', label: 'Monto' }], seed: [] },
    { key: 'gastos', label: 'Gastos', type: 'list',
      fields: [{ id: 'fecha', label: 'Fecha' }, { id: 'concepto', label: 'Concepto' }, { id: 'monto', label: 'Monto' }], seed: [] },
    { key: 'resultados', label: 'Resultados', type: 'note', seed: '' },
  ]},
];

// ---------------------------------------------------------------------------
// Almacenamiento (localStorage — vive en este navegador/dispositivo)
// ---------------------------------------------------------------------------
var PREFIX = 'ctc:';
var cache = {};

function findSection(key) { for (var i=0;i<SECTIONS.length;i++) if (SECTIONS[i].key===key) return SECTIONS[i]; return SECTIONS[0]; }
function findSub(section, key) { for (var i=0;i<section.subs.length;i++) if (section.subs[i].key===key) return section.subs[i]; return section.subs[0]; }

function storageKey(section, sub) { return (sub.type==='note'?'note-':'list-') + section.key + '-' + sub.key; }

function getValue(section, sub) {
  var key = storageKey(section, sub);
  if (!(key in cache)) {
    var raw = localStorage.getItem(PREFIX + key);
    if (raw === null) {
      var seedVal = sub.type === 'note' ? (sub.seed || '') : JSON.parse(JSON.stringify(sub.seed || []));
      cache[key] = seedVal;
      try { localStorage.setItem(PREFIX + key, sub.type === 'note' ? seedVal : JSON.stringify(seedVal)); } catch(e) {}
    } else {
      cache[key] = sub.type === 'note' ? raw : (function(){ try { return JSON.parse(raw); } catch(e){ return []; } })();
    }
  }
  return cache[key];
}

function saveValue(section, sub, value) {
  var key = storageKey(section, sub);
  cache[key] = value;
  try {
    localStorage.setItem(PREFIX + key, sub.type === 'note' ? (value || '') : JSON.stringify(value || []));
    showToast('Guardado ✓');
  } catch (e) {
    showToast('No se pudo guardar');
  }
}

var toastTimer = null;
function showToast(text) {
  var el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1100);
}

// ---------------------------------------------------------------------------
// Estado + render
// ---------------------------------------------------------------------------
var state = { sectionKey: SECTIONS[0].key, subKey: SECTIONS[0].subs[0].key };

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  var section = findSection(state.sectionKey);
  var sub = findSub(section, state.subKey);
  var root = document.getElementById('root');

  var html = '';
  html += '<header>';
  html += '  <div class="brand-title">¿CÓMO TE CAERÍA?</div>';
  html += '  <div class="subtitle">Sistema de marca &amp; contenido — Culiacán, Sinaloa</div>';
  html += '</header>';

  html += '<div class="tabs sections" id="section-tabs">';
  SECTIONS.forEach(function(s){
    html += '<button class="tab-btn' + (s.key===section.key?' active':'') + '" data-section="' + s.key + '">' + s.emoji + ' ' + s.label + '</button>';
  });
  html += '</div>';

  html += '<div class="tabs" id="sub-tabs">';
  section.subs.forEach(function(s){
    html += '<button class="sub-btn' + (s.key===sub.key?' active':'') + '" data-sub="' + s.key + '">' + s.label + '</button>';
  });
  html += '</div>';

  html += '<main id="panel"></main>';

  root.innerHTML = html;

  document.querySelectorAll('#section-tabs [data-section]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var newSection = findSection(btn.getAttribute('data-section'));
      state.sectionKey = newSection.key;
      state.subKey = newSection.subs[0].key;
      render();
    });
  });
  document.querySelectorAll('#sub-tabs [data-sub]').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.subKey = btn.getAttribute('data-sub');
      render();
    });
  });

  renderPanel(section, sub);
}

function renderPanel(section, sub) {
  var panel = document.getElementById('panel');
  if (sub.type === 'note') {
    var value = getValue(section, sub);
    panel.innerHTML =
      '<div class="row-between"><span class="panel-label">' + esc(sub.label) + '</span></div>' +
      '<textarea class="note-input" id="note-field" rows="8" placeholder="Escribe aquí sobre ' + esc(sub.label.toLowerCase()) + '…">' + esc(value) + '</textarea>';
    var field = document.getElementById('note-field');
    field.addEventListener('blur', function(){ saveValue(section, sub, field.value); });
  } else {
    renderList(section, sub);
  }
}

function renderList(section, sub) {
  var panel = document.getElementById('panel');
  var value = getValue(section, sub);

  var html = '<div class="row-between">';
  html += '<span class="panel-label">' + esc(sub.label) + ' · ' + value.length + '</span>';
  html += '<button class="add-btn" id="add-entry-btn">+ Agregar</button>';
  html += '</div>';

  if (value.length === 0) {
    html += '<div class="empty">Aún no hay nada aquí. Toca "Agregar" para el primero.</div>';
  }

  html += '<div id="entries-wrap">';
  value.forEach(function(entry){
    html += '<div class="entry-card" data-entry="' + entry.id + '">';
    html += '  <div class="entry-top"><button class="del-btn" data-del="' + entry.id + '">🗑</button></div>';
    sub.fields.forEach(function(f){
      var v = esc(entry[f.id] || '');
      html += '<div class="field-wrap"><div class="field-label">' + esc(f.label) + '</div>';
      if (f.long) {
        html += '<textarea class="field-textarea" rows="2" data-entry-id="' + entry.id + '" data-field="' + f.id + '">' + v + '</textarea>';
      } else {
        html += '<input class="field-input" type="text" value="' + v + '" data-entry-id="' + entry.id + '" data-field="' + f.id + '" />';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  html += '</div>';

  panel.innerHTML = html;

  document.getElementById('add-entry-btn').addEventListener('click', function(){
    var blank = { id: uid() };
    sub.fields.forEach(function(f){ blank[f.id] = ''; });
    var next = [blank].concat(getValue(section, sub));
    saveValue(section, sub, next);
    renderList(section, sub);
  });

  panel.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-del');
      var next = getValue(section, sub).filter(function(e){ return e.id !== id; });
      saveValue(section, sub, next);
      renderList(section, sub);
    });
  });

  panel.querySelectorAll('[data-entry-id]').forEach(function(input){
    input.addEventListener('blur', function(){
      var id = input.getAttribute('data-entry-id');
      var field = input.getAttribute('data-field');
      var next = getValue(section, sub).map(function(e){
        if (e.id !== id) return e;
        var copy = Object.assign({}, e);
        copy[field] = input.value;
        return copy;
      });
      saveValue(section, sub, next);
    });
  });
}

render();
</script>
</body>
</html>
